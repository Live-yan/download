name: 通用下载并发布 Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 下载类型
        required: true
        default: docker
        type: choice
        options:
          - docker
          - url
      source:
        description: Docker 镜像名或完整下载 URL
        required: true
        default: mysql:8.0.46
        type: string
      platform:
        description: Docker 目标平台；URL 模式会忽略
        required: true
        default: linux/arm64/v8
        type: string
      output_name:
        description: 输出文件名；留空则自动生成
        required: false
        default: mysql-8.0.46-arm64.tar
        type: string
      compression:
        description: 主文件压缩方式
        required: true
        default: gzip
        type: choice
        options:
          - none
          - gzip
          - zip
      release_tag:
        description: Release 标签；留空则自动生成
        required: false
        default: ""
        type: string
      release_title:
        description: Release 标题；留空则自动生成
        required: false
        default: ""
        type: string
      publish_release:
        description: 是否发布到 Releases
        required: true
        default: true
        type: boolean
  push:
    paths:
      - "requests/*.json"

permissions:
  contents: write

concurrency:
  group: universal-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    name: 下载、校验并发布
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 读取和校验任务参数
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_OUTPUT_NAME: ${{ inputs.output_name }}
          INPUT_COMPRESSION: ${{ inputs.compression }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$INPUT_MODE"
            source="$INPUT_SOURCE"
            platform="$INPUT_PLATFORM"
            output_name="$INPUT_OUTPUT_NAME"
            compression="$INPUT_COMPRESSION"
            release_tag="$INPUT_RELEASE_TAG"
            release_title="$INPUT_RELEASE_TITLE"
            publish_release="$INPUT_PUBLISH_RELEASE"
            request_file="手动运行"
          else
            request_file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^requests/[^/]+\.json$' \
              | tail -n 1 || true)"

            [[ -n "$request_file" ]] || {
              echo "没有在本次提交中找到 requests/*.json" >&2
              exit 1
            }

            jq -e 'type == "object"' "$request_file" >/dev/null

            mode="$(jq -r '.mode // ""' "$request_file")"
            source="$(jq -r '.source // ""' "$request_file")"
            platform="$(jq -r '.platform // "linux/arm64/v8"' "$request_file")"
            output_name="$(jq -r '.output_name // ""' "$request_file")"
            compression="$(jq -r '.compression // "none"' "$request_file")"
            release_tag="$(jq -r '.release_tag // ""' "$request_file")"
            release_title="$(jq -r '.release_title // ""' "$request_file")"
            publish_release="$(jq -r '.publish_release // true' "$request_file")"
          fi

          case "$mode" in
            docker|url) ;;
            *) echo "mode 只能是 docker 或 url" >&2; exit 1 ;;
          esac

          [[ -n "$source" ]] || {
            echo "source 不能为空" >&2
            exit 1
          }

          case "$compression" in
            none|gzip|zip) ;;
            *) echo "compression 只能是 none、gzip 或 zip" >&2; exit 1 ;;
          esac

          case "$publish_release" in
            true|false) ;;
            *) echo "publish_release 只能是 true 或 false" >&2; exit 1 ;;
          esac

          if [[ -z "$release_tag" ]]; then
            release_tag="download-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi

          if [[ -z "$release_title" ]]; then
            release_title="通用下载：${source}"
          fi

          {
            echo "mode=$mode"
            echo "source=$source"
            echo "platform=$platform"
            echo "output_name=$output_name"
            echo "compression=$compression"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "publish_release=$publish_release"
            echo "request_file=$request_file"
          } >> "$GITHUB_OUTPUT"

          echo "任务来源：$request_file"
          echo "模式：$mode"
          echo "来源：$source"
          echo "平台：$platform"
          echo "输出名：${output_name:-自动生成}"
          echo "压缩：$compression"
          echo "Release：$publish_release / $release_tag"

      - name: 下载并生成校验文件
        shell: bash
        env:
          MODE: ${{ steps.config.outputs.mode }}
          SOURCE: ${{ steps.config.outputs.source }}
          PLATFORM: ${{ steps.config.outputs.platform }}
          OUTPUT_NAME: ${{ steps.config.outputs.output_name }}
          COMPRESSION: ${{ steps.config.outputs.compression }}
          DIST_DIR: dist
        run: |
          set -euo pipefail
          chmod +x scripts/universal-download.sh
          scripts/universal-download.sh

      - name: 准备发布说明
        shell: bash
        env:
          MODE: ${{ steps.config.outputs.mode }}
          SOURCE: ${{ steps.config.outputs.source }}
          PLATFORM: ${{ steps.config.outputs.platform }}
          REQUEST_FILE: ${{ steps.config.outputs.request_file }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## 下载信息

          - 类型：\`$MODE\`
          - 来源：\`$SOURCE\`
          - 目标平台：\`$PLATFORM\`
          - 请求来源：\`$REQUEST_FILE\`
          - 工作流运行：\`${GITHUB_RUN_ID}\`
          - 提交：\`${GITHUB_SHA}\`
          - 生成时间：\`$(date -u '+%Y-%m-%dT%H:%M:%SZ')\`

          下载后请使用 Release 中的 \`SHA256SUMS\` 校验文件完整性。
          EOF

      - name: 上传 Actions 临时产物
        uses: actions/upload-artifact@v4
        with:
          name: universal-download-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: 创建或更新 Release
        if: ${{ steps.config.outputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.config.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.config.outputs.release_title }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，覆盖同名文件。"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi

          echo "Release 已发布：$RELEASE_TAG"

      - name: 输出结果摘要
        if: always()
        shell: bash
        env:
          MODE: ${{ steps.config.outputs.mode }}
          SOURCE: ${{ steps.config.outputs.source }}
          PLATFORM: ${{ steps.config.outputs.platform }}
          RELEASE_TAG: ${{ steps.config.outputs.release_tag }}
        run: |
          {
            echo "## 通用下载结果"
            echo
            echo "- 模式：\`$MODE\`"
            echo "- 来源：\`$SOURCE\`"
            echo "- 平台：\`$PLATFORM\`"
            echo "- Release 标签：\`${RELEASE_TAG:-未发布}\`"
            echo
            echo "### 文件"
            if [[ -d dist ]]; then
              find dist -maxdepth 1 -type f -printf '- `%f` (%s bytes)\n' | sort
            else
              echo "未生成 dist 目录。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
