name: PP-OCR Android runner diagnostic
on:
  push:
    branches: [build/ppocr-v6-tiny-android-20260918]
    paths: ['.github/workflows/ppocr-runner-probe.yml']
permissions:
  contents: read
  checks: read
jobs:
  runner-check:
    name: Probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - name: Check runner startup and original failure annotation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Runner started successfully'
          java -version
          gh api repos/Live-yan/download/check-runs/105488715484/annotations --jq '.[] | {message: .message, title: .title, annotation_level: .annotation_level}'
