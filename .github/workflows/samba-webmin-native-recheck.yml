name: Native VM fixture recheck - pinned candidates only
on:
  push:
    branches: [build/samba-webmin-offline-20261030]
    paths:
      - samba-webmin/native/vm/**
      - .github/workflows/samba-webmin-native-recheck.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-vm-recheck-${{ github.ref }}
  cancel-in-progress: true
env:
  BASE_SHA: 0e79973bf0f0cbe82cc341e1889d60fd6563ffbe
  SOURCE_RUN: "41003592479"
  SOURCE_JOB: "123893342248"
  ARTIFACT_ID: "12955308865"
  ARTIFACT_SHA256: 5787efd71b4283c573b814d3e297cd34fb14c3ee17a7c01f1ab35b3cd93c7281
jobs:
  guard:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify narrowly authorized fixture-only changes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Live-yan/download
          test "$GITHUB_REF" = refs/heads/build/samba-webmin-offline-20261030
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- \
            samba-webmin/native \
            ':(exclude)samba-webmin/native/vm'
          python3 - <<'PY'
          import os, subprocess
          path = ".github/workflows/samba-webmin-native-source.yml"
          old = subprocess.check_output(
              ["git", "show", os.environ["BASE_SHA"] + ":" + path])
          new = subprocess.check_output(["git", "show", "HEAD:" + path])
          line = b"      - samba-webmin/native/vm/**\n"
          assert old.count(line) == 1, "Unexpected baseline trigger"
          assert new == old.replace(line, b""), \
              "Only the exact reviewed trigger-line deletion is allowed"
          PY
      - name: Verify fixed source job and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > provenance/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" > provenance/job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > provenance/artifact.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          read = lambda name: json.loads(
              Path("provenance/" + name + ".json").read_text())
          run, job, artifact = map(read, ("run", "job", "artifact"))
          sha = os.environ["BASE_SHA"]
          branch = "build/samba-webmin-offline-20261030"
          runid = int(os.environ["SOURCE_RUN"])
          assert run["id"] == runid
          assert run["repository"]["full_name"] == "Live-yan/download"
          assert run["head_repository"]["full_name"] == "Live-yan/download"
          assert run["head_sha"] == sha
          assert run["head_branch"] == branch
          assert run["event"] == "push"
          assert run["run_attempt"] == 1
          assert run["path"] == ".github/workflows/samba-webmin-native-source.yml"
          assert job["id"] == int(os.environ["SOURCE_JOB"])
          assert job["run_id"] == runid
          assert job["run_attempt"] == 1
          assert job["head_sha"] == sha
          assert job["name"] == "source"
          assert job["status"] == "completed"
          assert job["conclusion"] == "success"
          # Deliberately do not require the whole run to succeed.
          assert artifact["id"] == int(os.environ["ARTIFACT_ID"])
          assert artifact["name"] == "native-offline-candidates-NOT-VM-VERIFIED"
          assert artifact["expired"] is False
          assert artifact["size_in_bytes"] == 269605426
          assert artifact["digest"] == "sha256:" + os.environ["ARTIFACT_SHA256"]
          origin = artifact["workflow_run"]
          assert origin["id"] == runid
          assert origin["head_sha"] == sha
          assert origin["head_branch"] == branch
          assert origin["repository_id"] == run["repository"]["id"]
          assert origin["head_repository_id"] == run["repository"]["id"]
          print("Pinned successful source job and exact candidate artifact verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-recheck-provenance
          path: provenance/
          retention-days: 7
          if-no-files-found: error
  vm:
    needs: guard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        case: [samba]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download and strictly verify immutable candidate archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/native-candidate.zip"
          python3 - <<'PY'
          import hashlib, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ["RUNNER_TEMP"]) / "native-candidate.zip"
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(block)
          assert digest.hexdigest() == os.environ["ARTIFACT_SHA256"], \
              "Candidate ZIP digest mismatch"
          target = Path("native-bundles")
          assert not target.exists(), "Unexpected existing candidate directory"
          target.mkdir()
          with zipfile.ZipFile(archive) as z:
              names = set()
              for item in z.infolist():
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert path.parts and path.parts[0] in ("samba422", "webmin")
                  assert "\\" not in item.filename
                  assert item.filename not in names, "Duplicate ZIP entry"
                  names.add(item.filename)
                  mode = item.external_attr >> 16
                  assert not stat.S_ISLNK(mode), "Unexpected artifact symlink"
              z.extractall(target)
          assert (target / "samba422/offline.repo").is_file()
          assert (target / "webmin/offline.repo").is_file()
          archive.unlink()
          PY
      - name: Install distribution QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Recheck current fixture against pinned older candidate
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p vm-evidence
          printf '%s\n' \
            "DEBUG ONLY: old candidate build $BASE_SHA, current VM fixture $GITHUB_SHA" \
            "Source run $SOURCE_RUN, candidate artifact $ARTIFACT_ID" \
            "Not a final-SHA rebuild and not release authorization." \
            > vm-evidence/RECHECK-SCOPE.txt
          bash samba-webmin/native/vm/run-native.sh "$CASE"
      - name: Preserve nonsecret VM evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-recheck-vm-${{ matrix.case }}
          path: vm-evidence/
          retention-days: 7
          if-no-files-found: warn
