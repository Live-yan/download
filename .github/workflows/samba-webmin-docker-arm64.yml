name: Samba Webmin Docker ARM64 build gate

on:
  push:
    branches:
      - build/samba-webmin-offline-20261030
    paths:
      - "samba-webmin/**"
      - ".github/workflows/samba-webmin-docker-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samba-webmin-docker-arm64
  cancel-in-progress: false

jobs:
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-version ARM64 image
        run: |
          set -euxo pipefail
          docker build --pull --platform linux/arm64 \
            --build-arg SAMBA_VERSION=4.22.11 \
            --build-arg WEBMIN_VERSION=2.670 \
            -t local/samba-webmin:4.22.11-webmin-2.670-arm64 \
            samba-webmin/docker
      - name: Verify image architecture and software entrypoints
        run: |
          set -euxo pipefail
          test "$(docker image inspect local/samba-webmin:4.22.11-webmin-2.670-arm64 --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          docker run --rm --entrypoint /usr/sbin/smbd \
            local/samba-webmin:4.22.11-webmin-2.670-arm64 -V | grep -F '4.22.11'
          docker run --rm --entrypoint test \
            local/samba-webmin:4.22.11-webmin-2.670-arm64 -f /usr/share/webmin/miniserv.pl
      - name: Save image for offline bundle assembly
        run: |
          set -euxo pipefail
          mkdir -p dist
          docker save local/samba-webmin:4.22.11-webmin-2.670-arm64 | gzip -1 > dist/webmin-samba-arm64.tar.gz
          test -s dist/webmin-samba-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: samba-webmin-docker-arm64-intermediate
          path: dist/webmin-samba-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
