[global]
    netbios name = FILESERVER
    server role = standalone server
    security = user
    server min protocol = SMB2_10
    smb ports = 445
    map to guest = Never
    restrict anonymous = 2
    passdb backend = tdbsam
    log file = /var/lib/samba-4.22.11/log.%m
    max log size = 1000
    load printers = no
    disable spoolss = yes
