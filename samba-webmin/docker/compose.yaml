name: samba-webmin
x-image: &image local/samba-webmin:4.22.11-webmin-2.670-arm64
x-volumes: &volumes
  - system_config:/etc
  - samba_state:/var/lib/samba
  - samba_share:/srv/samba/share
  - webmin_var:/var/webmin
services:
  initialize:
    image: *image
    platform: linux/arm64
    pull_policy: never
    profiles: [initialize]
    network_mode: none
    stdin_open: true
    tty: true
    command: [initialize]
    restart: "no"
    healthcheck:
      disable: true
    volumes: *volumes
  samba-webmin:
    image: *image
    platform: linux/arm64
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      WEBMIN_HOST: "${WEBMIN_HOST:?请填写Nginx外部域名}"
      WEBMIN_PUBLIC_SCHEME: "${WEBMIN_PUBLIC_SCHEME:-https}"
      WEBMIN_PUBLIC_PORT: "${WEBMIN_PUBLIC_PORT:-443}"
    ports:
      - "${SMB_BIND_IP:?请填写内网IP}:445:445/tcp"
      - "127.0.0.1:10000:10000/tcp"
    volumes: *volumes
volumes:
  system_config:
  samba_state:
  samba_share:
  webmin_var:
